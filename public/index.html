<style>

*{box-sizing:border-box}

@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-2.5%,2%,0) scale(1.08)}}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:var(--ink);background:var(--nbg);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:9px 18px;font-weight:700;box-shadow:6px 6px 13px rgba(146,157,167,.5),-5px -5px 12px rgba(255,255,255,.95);transition:transform .18s,box-shadow .18s,background .18s,color .18s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:8px 10px 18px rgba(146,157,167,.55),-5px -5px 12px rgba(255,255,255,1),0 0 0 2px rgba(255,75,50,.35)}
button:active:not(:disabled){transform:translateY(0) scale(.97);box-shadow:var(--inset)}button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 10px 22px rgba(23,25,28,.35)}
button.primary:hover:not(:disabled){background:#23272c;box-shadow:0 12px 26px rgba(23,25,28,.4),0 0 0 3px rgba(255,75,50,.55)}
button.primary:active:not(:disabled){box-shadow:inset 3px 3px 8px rgba(0,0,0,.5)}
button.danger{background:#fff;color:#B52B15;border-color:rgba(255,75,50,.55)}button.ghost{background:transparent;box-shadow:none;border-color:var(--steel)}
button.small{padding:5px 12px;font-size:13px}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

input::placeholder{color:#5A6672}input[readonly]{background:#E2E6EB;font-weight:700;color:#8A2412}

option{background:#fff;color:var(--ink)}label{display:grid;gap:5px;color:#2b333a;font-size:13px;font-weight:700}
.hidden{display:none!important}.muted{color:var(--muted)}.err{color:#B52B15;min-height:20px;margin:8px 0 0;font-weight:700}
.app{max-width:1440px;margin:auto;padding:16px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px 10px 18px;border-radius:999px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:50%;background:#fff url(icons/logo-192.png) center/cover no-repeat;color:transparent;font-size:0;box-shadow:0 0 0 2px #fff,0 6px 16px rgba(18,53,91,.28);transition:transform .6s}.brand:hover .logo{transform:rotateY(360deg)}
.brand h1{font-size:18px;margin:0;letter-spacing:-.02em}.brand small{color:var(--muted)}.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.who span{color:#2b333a;font-size:13px;font-weight:600}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;margin-top:16px}

.navbtn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border-color:transparent;color:#DCE1E6;margin:2px 0;box-shadow:none;border-radius:999px}
.navbtn span{width:22px;text-align:center;color:var(--steel)}.navbtn:hover:not(:disabled){background:rgba(255,255,255,.08);box-shadow:none;transform:translateX(3px)}
.navbtn.active{background:var(--grad);color:var(--ink);border-color:transparent;box-shadow:0 8px 18px rgba(255,75,50,.4)}.navbtn.active span{color:var(--ink)}
.mainpanel{border-radius:28px;padding:22px;min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:800;margin:0 0 4px}.pagehead h2{font-size:clamp(28px,3.6vw,44px);line-height:1.05;letter-spacing:-.035em;font-weight:800;margin:0}.sub{color:var(--muted);margin:6px 0 0}

.stat:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 6px 6px 0;background:var(--grad)}

.tablewrap{overflow:auto;border:1px solid rgba(255,255,255,.9);border-radius:20px;background:#EDF0F3;box-shadow:var(--inset)}

.empty{padding:22px;text-align:center;color:var(--muted)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}.pager span:last-child{display:flex;gap:6px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid .full{grid-column:1/-1}

.notice{padding:11px 14px;border:1px solid rgba(255,75,50,.4);background:rgba(255,75,50,.1);color:#6F2013;border-radius:16px;margin-bottom:14px;font-size:13px;font-weight:600}

.floaties{position:relative;z-index:1;display:grid;gap:12px;max-width:340px}

.fcard i:after{content:"";position:absolute;inset:0;width:var(--w);background:var(--grad);border-radius:9px;transform-origin:left;animation:grow 1.2s .5s cubic-bezier(.2,.8,.2,1) both}
.logincard{width:min(430px,100%);border-radius:32px;padding:28px;animation:flipIn .7s cubic-bezier(.2,.8,.2,1)}
.logincard .logo{margin-bottom:12px;width:92px;height:92px}.logincard h1{margin:0 0 4px;font-size:26px;letter-spacing:-.03em}.logincard form{display:grid;gap:12px;margin-top:14px}
.pwwrap{position:relative;display:block}.pwwrap input{padding-right:70px}
.pwwrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:4px 11px;font-size:12px;box-shadow:none;background:transparent;border-color:var(--steel)}.pwwrap button:hover:not(:disabled){transform:translateY(-50%);box-shadow:none}
button.loading{opacity:.75;pointer-events:none}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;margin-bottom:12px}.kv b{color:#2b333a}
@keyframes bob{50%{transform:translateY(-7px)}}@keyframes grow{from{transform:scaleX(0)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}.logincard.shake{animation:shake .4s}
@keyframes flipIn{from{opacity:0;transform:perspective(900px) rotateX(-28deg) translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:perspective(900px) translateY(14px) rotateX(-12deg)}to{opacity:1;transform:none}}
.enter .stat,.enter .card,.enter .classrow,.enter .notice,.enter .pagehead{transform-origin:50% 0;animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.enter .stat:nth-child(2){animation-delay:.06s}.enter .stat:nth-child(3){animation-delay:.12s}.enter .stat:nth-child(4){animation-delay:.18s}.enter .card{animation-delay:.1s}
@keyframes flipOut{to{opacity:0;transform:perspective(900px) rotateX(16deg) translateY(-12px) scale(.98)}}
@keyframes flipOutY{to{opacity:0;transform:perspective(1100px) rotateY(-70deg) scale(.92)}}
@keyframes flipInY{from{opacity:0;transform:perspective(1100px) rotateY(60deg) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0}}
.flip-in{animation:flipInY .7s cubic-bezier(.2,.8,.2,1) both}
#login.leaving .loginshell{animation:flipOutY .42s cubic-bezier(.5,0,.8,.4) forwards}
.mainpanel{position:relative}
.pghost{position:absolute;inset:0;padding:inherit;overflow:hidden;border-radius:inherit;pointer-events:none;transform-origin:50% 0;animation:flipOut .36s cubic-bezier(.4,0,.8,.4) forwards}
.modalback.closing{animation:fadeOut .2s forwards}.modalback.closing .modal{animation:flipOut .2s forwards}
.toast{display:block;opacity:0;visibility:hidden;transform:translateY(14px) scale(.96);animation:none;transition:opacity .3s,transform .3s,visibility .3s}
.toast.show{opacity:1;visibility:visible;transform:none;animation:none}
@media print{.pghost{display:none!important}}
/* ===== smooth motion on every card ===== */
.card,.stat,.classrow,.fcard,.notice,.logincard,.pagehead{transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s cubic-bezier(.2,.8,.2,1),background-color .35s ease,border-color .35s ease,opacity .35s ease}
.card:hover,.fcard:hover{transform:translateY(-3px);box-shadow:0 20px 48px rgba(23,25,28,.16),inset 0 1px 0 #fff}
.classrow:hover{transform:translateX(6px) translateY(-1px);box-shadow:10px 11px 22px rgba(146,157,167,.55),-7px -7px 16px #fff}
.notice:hover{transform:translateY(-2px)}
.stat:hover{transform:perspective(700px) translateY(-5px) rotateX(5deg)}
.stat:before{transition:width .35s ease}.stat:hover:before{width:8px}
.enter .card,.enter .stat,.enter .classrow,.enter .notice,.enter .fcard{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.enter .card:nth-child(2){animation-delay:.08s}.enter .card:nth-child(3){animation-delay:.16s}.enter .card:nth-child(n+4){animation-delay:.22s}
.enter .classrow:nth-child(2){animation-delay:.05s}.enter .classrow:nth-child(3){animation-delay:.1s}.enter .classrow:nth-child(4){animation-delay:.15s}.enter .classrow:nth-child(n+5){animation-delay:.2s}
.enter .notice{animation-delay:.04s}
@keyframes cardIn{from{opacity:0;transform:perspective(900px) translateY(10px) rotateX(-8deg)}to{opacity:1;transform:none}}
.card.cardin,.classrow.cardin,.stat.cardin{animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.top,.mainpanel,.card,.logincard,.fcard,.modal{background:#F1F3F6}}

@media(max-width:820px){.loginshell{grid-template-columns:1fr}.loginhero{display:none}}
@media(max-width:560px){.app{padding:8px}.mainpanel{padding:14px;border-radius:22px}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.toolbar>*{min-width:100%}.kv{grid-template-columns:1fr}.stat strong{font-size:24px}.actions button{flex:1 1 140px}.top,.mainpanel,.card,.logincard,.modal{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}}
.slips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}

.slip b{font-size:14px}.slip small{color:var(--muted)}
@media(max-width:560px){.slips{grid-template-columns:1fr}}
@media print{.slip{break-inside:avoid;border:1px dashed #000;background:#fff}.slips{grid-template-columns:repeat(2,1fr)}}
/* ===== phone-friendly layout ===== */
@media(max-width:900px){
 body::before{animation:none}
 .top,.mainpanel,.card,.logincard,.fcard,.modal,.sidebar{-webkit-backdrop-filter:none;backdrop-filter:none}
 .top,.mainpanel,.card{background:rgba(255,255,255,.86)}
 .app{padding:8px 8px calc(84px + env(safe-area-inset-bottom))}

 .navbtn{flex-direction:column;gap:0;padding:6px 14px;font-size:12px;border-radius:18px;min-width:68px}
 .navbtn span{width:auto;font-size:18px;line-height:1.1}

 td,th{padding:10px 10px}
 .kv{grid-template-columns:130px 1fr}
}
@media(max-width:560px){
 input,select,textarea{font-size:16px;min-height:46px}
 .pagehead h2{font-size:28px}

}
@media print{body::before{display:none}body{background:#fff;color:#000}.top,.sidebar,.actions,.toolbar,.noprint,.pager,.toast,.loginwrap{display:none!important}.layout{display:block}.mainpanel,.card,.stat,.tablewrap{background:#fff;color:#000;box-shadow:none;border:1px solid #999;-webkit-backdrop-filter:none;backdrop-filter:none}td,th,.stat strong,.stat .sl{color:#000!important}th{background:#eee}
.app.printing-modal{display:none!important}.modalback{position:static;background:#fff;display:block!important;padding:0}.modal{background:#fff;color:#000;border:0;box-shadow:none;max-height:none;width:100%}.modal *{color:#000!important}.modalhead button{display:none}}

/* ===== page flip: the page turns, then every card flips in one by one ===== */
#view.flipout{animation:pgOut .2s cubic-bezier(.5,0,.9,.4) forwards;pointer-events:none}
#view.flipin{animation:pgIn .55s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes pgOut{to{opacity:0;transform:perspective(1400px) rotateY(75deg) scale(.96)}}
@keyframes pgIn{from{opacity:0;transform:perspective(1400px) rotateY(-75deg) scale(.96)}}
@keyframes cardFlip{from{opacity:0;transform:perspective(900px) rotateX(-85deg) translateY(12px)}}
#view.enter .pagehead,#view.enter .notice,#view.enter .stat,#view.enter .card,#view.enter .classrow{transform-origin:50% 0;backface-visibility:hidden;animation:cardFlip .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*55ms + 140ms)}
.flip-in{animation:flipInY .7s cubic-bezier(.2,.8,.2,1) backwards}

/* ===== blocks assemble one by one ===== */
@keyframes blockIn{0%{opacity:0;transform:translate(var(--fx,-80px),var(--fy,-22px)) rotate(var(--fr,-5deg)) scale(.7)}65%{opacity:1;transform:translate(0,0) rotate(0) scale(1.04)}100%{opacity:1;transform:none}}

let impRows=[],impBusy=false,lastCreds=null;
function parseCSV(text){
 text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'',cnt=c=>first.split(c).length-1;
 const d=[',',';','\t'].sort((a,b)=>cnt(b)-cnt(a))[0],rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;
  else if(c===d){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
  else f+=c}
 row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
const IMP_COLS={adm:['admissionno','admission','admno','admissionnumber','regno','grno'],name:['studentname','name','student'],father:['fathername','father','guardian','guardianname','parentname','parent'],cls:['class','classname','grade'],phone:['phone','whatsapp','mobile','parentphone','contact','fatherphone'],fee:['monthlyfee','fee'],roll:['roll','rollno','rollnumber'],date:['admissiondate']};
function importPlan(rows,dfee,forced){
 if(rows.length<2)return {fatal:'The file has no student rows.'};
 const head=rows[0].map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,'')),col={};
 for(const k in IMP_COLS)col[k]=head.findIndex(h=>IMP_COLS[k].includes(h));
 const miss=['adm','name','father'].concat(forced?[]:['cls']).filter(k=>col[k]<0).map(k=>({adm:'admission_no',name:'student_name',father:'father_name',cls:'class'}[k]));
 if(miss.length)return {fatal:'Missing column(s): '+miss.join(', ')+'. Download the template to see the correct headings.'};
 const items=[],errors=[],seen=new Set();
 rows.slice(1).forEach((r,i)=>{const line=i+2,v=k=>col[k]<0?'':String(r[col[k]]??'').trim();
  const o={line,adm:v('adm'),name:v('name'),father:v('father'),cls:v('cls'),phoneRaw:v('phone'),feeRaw:v('fee'),rollRaw:v('roll'),date:v('date')};
  if(forced)o.cls=forced;
  if(!o.adm||!o.name||!o.father||!o.cls){errors.push('Row '+line+': admission no, student name and father name'+(forced?'':' and class')+' are required.');return}
  if(seen.has(o.adm)){errors.push('Row '+line+': admission no '+o.adm+' appears twice in the file.');return}seen.add(o.adm);
  const ph=normPhone(o.phoneRaw);if(ph===null){errors.push('Row '+line+': invalid phone number "'+o.phoneRaw+'".');return}o.phone=ph;
  const fee=o.feeRaw===''?dfee:Number(o.feeRaw);if(!Number.isInteger(fee)||fee<0){errors.push('Row '+line+': invalid monthly fee "'+o.feeRaw+'".');return}o.fee=fee;
  if(o.date&&!/^\d{4}-\d{2}-\d{2}$/.test(o.date))o.date='';if(!o.date)o.date=today();
  items.push(o)});
 return {items,errors,forced}}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}
const nearClass=n=>{const l=n.toLowerCase(),c=db.classes.find(c=>lev(c.name.toLowerCase(),l)<=2);return c?c.name:''};
function importPreview(plan){

async function importRun(){

 const plan=importPlan(impRows,dfee,impForced());if(plan.fatal)return alert(plan.fatal);if(!plan.items.length)return alert('There are no valid rows to import.');
 const cl0=new Set(db.classes.map(c=>c.name.toLowerCase()));if(plan.items.some(o=>!cl0.has(o.cls.toLowerCase()))&&!$('#f_okcls')?.checked)return alert('The file has class names that do not exist yet. Check the list in the preview and tick "These class names are correct", or fix the file.');
 const link=g('link')||appLink(),st=$('#impStatus');impBusy=true;
 try{
  const cmap={},mx={},byAdm={};let newCls=0,newSt=0,noPhone=0;

  db.students.forEach(s=>{byAdm[s.admissionNo]=s;if(s.status==='Active')mx[s.classId]=Math.max(mx[s.classId]||0,s.roll)});

   if(!byAdm[o.adm]){let roll=Number(o.rollRaw);const taken=db.students.some(x=>x.status==='Active'&&x.classId===c.id&&x.roll===roll);
    if(!Number.isInteger(roll)||roll<1||taken)roll=(mx[c.id]||0)+1;mx[c.id]=Math.max(mx[c.id]||0,roll);
    const s={id:uid(),name:o.name.slice(0,80),father:o.father.slice(0,80),phone:o.phone,classId:c.id,roll,admissionNo:o.adm.slice(0,30),admissionDate:o.date,monthlyFee:o.fee,status:'Active'};
    db.students.push(s);byAdm[o.adm]=s;newSt++;if(!o.phone)noPhone++}}
  audit('import',newSt+' new students, '+newCls+' new classes, '+plan.errors.length+' rows skipped');
  st.textContent='Saving '+newSt+' students to the school database...';

   +(noPhone?' '+noPhone+' student(s) have no phone number, so they got no parent login.':'')
   +(loginErr?' Parent logins could not be created ('+loginErr+'). Use Accounts > Create missing parent logins.':''))
 }catch(e){impBusy=false;if(st)st.textContent='';alert('The import did not finish. '+(e&&e.message?e.message:'')+'\n\nSome students may already be saved. Upload the same file again to continue: students that already exist are skipped.')}}

function marksView(e){
 const st=classStudents(e.cid),m=RES.mk[e.id]||{},lk=e.pub&&!isAdmin();
 return header(esc(e.name)+' \u00b7 '+esc(e.subject),esc(clsName(e.cid))+' \u00b7 '+esc(e.term||'No term')+' \u00b7 Total marks '+e.total,`<button data-action="res-back">\u2190 Back</button>${lk?'':'<button class="primary" data-action="res-save">Save marks</button>'}`)+(lk?'<div class="notice">This test is published, so the marks are locked. Go back, press Unpublish on this test, change the marks, then Publish again.</div>':e.pub?'<div class="notice">This test is published. Parents see any change at once.</div>':'')+
 `<section class="card">${table(['Roll','Student','Marks (0\u2013'+e.total+')','Absent','Result'],st.map(s=>{const r=m[s.id]||{};return`<tr><td>${esc(s.roll)}</td><td><b>${esc(s.name)}</b></td><td><input class="rm" data-sid="${esc(s.id)}" type="number" inputmode="decimal" min="0" max="${e.total}" step="0.5" value="${r.a||r.m==null?'':r.m}" ${r.a||lk?'disabled':''} style="max-width:110px"></td><td><input class="ra" data-sid="${esc(s.id)}" type="checkbox" ${r.a?'checked':''} ${lk?'disabled':''} style="width:auto"></td><td>${r.a?'Absent':r.m==null?'\u2014':gpill(r.m/e.total*100)}</td></tr>`}).join(''))}</section>`}

async function saveMarks(){
 const e=RES.ex.find(x=>x.id===ui.resExam);if(!e||!canClass(e.cid))return;
 if(e.pub&&!isAdmin())return alert('This test is published. Unpublish it first to change marks.');
 const up=[],del=[];let bad='';const now=new Date().toISOString();
 document.querySelectorAll('.rm').forEach(inp=>{const sid=inp.dataset.sid,ab=document.querySelector('.ra[data-sid="'+sid+'"]').checked,v=inp.value.trim();
  if(ab){up.push({exam_id:e.id,student_id:sid,marks:null,absent:true,entered_by:me.id,updated_at:now});return}
  if(v===''){if((RES.mk[e.id]||{})[sid])del.push(sid);return}
  const n=Number(v);if(!isFinite(n)||n<0||n>e.total){bad=bad||'Marks must be between 0 and '+e.total+'.';return}
  up.push({exam_id:e.id,student_id:sid,marks:n,absent:false,entered_by:me.id,updated_at:now})});
 if(bad)return alert(bad);
 if(up.length){const r=await sb.from('exam_marks').upsert(up,{onConflict:'exam_id,student_id'});if(r.error)return alert(r.error.message)}
 for(const sid of del){const r=await sb.from('exam_marks').delete().eq('exam_id',e.id).eq('student_id',sid);if(r.error)return alert(r.error.message)}
 ui.resExam='';await reloadRes();toast('Marks saved.')}

function examForm(x){
 const ed=!!x;x=x||{};const cid=ed?x.cid:curClass('resClass');if(!canClass(cid))return;
 const subs=[...new Set(RES.ex.filter(e=>e.cid===cid).map(e=>e.subject))];
 openModal(ed?'Edit test':'New test',`<div class="formgrid">${isAdmin()&&!ed?sel('rcid','Class',db.classes.map(c=>[c.id,c.name]),cid):''}${sel('rterm','Term',TERMS.map(t=>[t,t]),x.term||(TERMS.includes(ui.resTerm)?ui.resTerm:TERMS[0]))}${fld('rname','Test name (e.g. Monthly Test 1)',x.name,'text','maxlength="80"')}${fld('rsub','Subject',x.subject,'text','maxlength="60" list="rsubs"')}<datalist id="rsubs">${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>${fld('rtot','Total marks',x.total||100,'number','min="1" max="1000"')}${fld('rdate','Date',x.date||today(),'date')}</div>`+formBtns('Save'),async()=>{
  const k=ed?x.cid:(isAdmin()?g('rcid'):me.classId),o={class_id:k,term:g('rterm'),name:g('rname'),subject:g('rsub'),total_marks:Number(g('rtot')),exam_date:g('rdate')};
  if(!canClass(k))return alert('Not allowed.');
  if(!o.name||!o.subject)return alert('Enter the test name and the subject.');
  if(!(o.total_marks>0&&o.total_marks<=1000))return alert('Total marks must be between 1 and 1000.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(o.exam_date))return alert('Enter a valid date.');
  let r;if(ed){delete o.class_id;r=await sb.from('exams').update({...o,updated_at:new Date().toISOString()}).eq('id',x.id)}else{o.created_by=me.id;r=await sb.from('exams').insert(o)}
  if(r.error)return alert(r.error.message+(/term/i.test(r.error.message)?'\n\nRun the file 3-RESULTS-term.sql once in Supabase (SQL Editor).':''));
  closeModal();await reloadRes();toast('Test saved.')})}

async function resAct(a,b){
 if(a==='res-print')return window.print();
 if(isParent())return;const id=b.dataset.id,e=RES.ex.find(x=>x.id===id);
 switch(a){
  case'res-add':return examForm(null);
  case'res-edit':if(e&&canClass(e.cid))examForm(e);return;
  case'res-open':if(e&&canClass(e.cid)){ui.resExam=id;render();window.scrollTo(0,0)}return;
  case'res-back':ui.resExam='';render();return;
  case'res-save':return saveMarks();
  case'res-pub':{if(!e||!canClass(e.cid))return;
   if(!e.pub&&!Object.keys(RES.mk[e.id]||{}).length)return alert('Enter marks first, then publish.');
   if(!confirm(e.pub?'Hide this test from parents?':'Publish this test? Parents will see their child\u2019s marks.'))return;
   const r=await sb.from('exams').update({published:!e.pub,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);
   await reloadRes();toast(e.pub?'Test hidden from parents.':'Published for parents.');return}
  case'res-del':{if(!e||!canClass(e.cid))return;if(!confirm('Delete this test and all its marks? This cannot be undone.'))return;
   const r=await sb.from('exams').delete().eq('id',id);if(r.error)return alert(r.error.message);await reloadRes();toast('Test deleted.');return}
  case'res-student':{const s=db.students.find(x=>x.id===id);if(!s||!canStudent(s))return;
   openModal(esc(s.name)+' \u00b7 '+esc(clsName(s.classId)),`<p class="muted">${esc(SCHOOL())} \u00b7 ${ui.resTerm==='all'?'All terms':esc(ui.resTerm)}</p>`+stuHtml(s,ui.resTerm,true)+`<div class="formactions"><button class="ghost" data-action="close-modal">Close</button><button class="primary" data-action="print-report">Print result card</button></div>`);return}
 }}

const UR_RE=[[/^Welcome, (.*)\.$/,(m,n)=>'خوش آمدید، '+n+'۔'],[/^(.*) · (Admin|Manager|Teacher|Parent)(.*)$/,(m,a,r,c)=>a+' · '+UR[r]+c]];
let LANG='en';try{LANG=localStorage.getItem('smhs_lang')==='ur'?'ur':'en'}catch(e){}
const trMap=new WeakMap();
function urText(v){const t=v.trim();if(!t)return null;const lw=v.match(/^\s*/)[0],tw=v.match(/\s*$/)[0];
 if(UR[t])return lw+UR[t]+tw;
 for(const [re,fn] of UR_RE){const m=t.match(re);if(m)return lw+fn.apply(null,m)+tw}
 const m=t.match(/^([^A-Za-z]*)([A-Za-z](?:[A-Za-z .'’&\/()-]*[A-Za-z)])?)([^A-Za-z]*)$/);
 if(m&&UR[m[2]])return lw+m[1]+UR[m[2]]+m[3]+tw;return null}
function trNode(n){const v=n.nodeValue,r=trMap.get(n);
 if(LANG==='ur'){if(r&&v===r.t)return;const u=urText(v);if(u!==null&&u!==v){trMap.set(n,{o:v,t:u});n.nodeValue=u}else if(r)trMap.delete(n)}
 else if(r){if(v===r.t)n.nodeValue=r.o;trMap.delete(n)}}
function trAll(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode;return p&&!/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)&&!(p.closest&&p.closest('[data-notr]'))?1:2}});
 const a=[];while(w.nextNode())a.push(w.currentNode);a.forEach(trNode);
 root.querySelectorAll('[placeholder]').forEach(el=>{const ph=el.getAttribute('placeholder');
  if(LANG==='ur'){const u=urText(ph);if(u&&u!==ph){if(el.dataset.phEn===undefined)el.dataset.phEn=ph;el.setAttribute('placeholder',u)}}
  else if(el.dataset.phEn!==undefined){el.setAttribute('placeholder',el.dataset.phEn);delete el.dataset.phEn}})}
function setLang(){LANG=LANG==='ur'?'en':'ur';try{localStorage.setItem('smhs_lang',LANG)}catch(e){}applyLang()}
function applyLang(){document.body.classList.toggle('ur',LANG==='ur');document.documentElement.lang=LANG;
 document.querySelectorAll('[data-action="lang"]').forEach(b=>b.textContent=LANG==='ur'?'English':'اردو');trAll(document.body)}
{let raf=0;new MutationObserver(()=>{if(LANG!=='ur'||raf)return;raf=requestAnimationFrame(()=>{raf=0;trAll(document.body)})}).observe(document.body,{childList:true,subtree:true})}
